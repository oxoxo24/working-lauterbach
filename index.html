<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Working with photographer Steffen Lauterbach near Bern, Switzerland.">
  <meta name="theme-color" content="#f2efe7">
  <title>Working Together | Steffen Lauterbach</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page-loader" aria-hidden="true"><span></span></div>
  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="Back to top">
      <span>Steffen Lauterbach</span><small>Photography · Bern</small>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span>Menu</span><i></i>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation"></nav>
  </header>

  <main id="top">
    <section class="hero section" id="hero">
      <div class="shell hero-grid">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-lead" id="hero-lead"></p>
          <p class="hero-description" id="hero-description"></p>
          <nav class="hero-links" id="hero-links" aria-label="Page sections"></nav>
        </div>
        <figure class="portrait-frame reveal">
          <img id="hero-image" src="" alt="">
          <figcaption id="hero-caption"></figcaption>
        </figure>
      </div>
    </section>

    <section class="section expectation-section" id="expect">
      <div class="shell">
        <p class="eyebrow reveal" id="expect-eyebrow"></p>
        <div class="section-heading-grid">
          <h2 class="display reveal" id="expect-title"></h2>
          <p class="section-intro reveal" id="expect-intro"></p>
        </div>
        <div class="principle-grid" id="expect-items"></div>
        <div id="expect-series"></div>
      </div>
    </section>

    <section class="section process-section is-dark" id="process">
      <div class="shell">
        <p class="eyebrow reveal" id="process-eyebrow"></p>
        <div class="section-heading-grid">
          <h2 class="display reveal" id="process-title"></h2>
          <div class="process-copy reveal" id="process-copy"></div>
        </div>
        <blockquote class="large-quote reveal" id="process-quote"></blockquote>
        <div id="process-series"></div>
      </div>
    </section>

    <section class="section formats-intro" id="work">
      <div class="shell">
        <p class="eyebrow reveal" id="work-eyebrow"></p>
        <div class="section-heading-grid">
          <h2 class="display reveal" id="work-title"></h2>
          <p class="section-intro reveal" id="work-intro"></p>
        </div>
        <div class="format-cards" id="format-cards"></div>
      </div>
    </section>

    <div id="format-sections"></div>

    <section class="section about-section" id="about">
      <div class="shell">
        <p class="eyebrow reveal" id="about-eyebrow"></p>
        <div class="section-heading-grid about-heading">
          <h2 class="display reveal" id="about-title"></h2>
          <div class="about-copy reveal" id="about-copy"></div>
        </div>
        <div id="about-series"></div>
      </div>
    </section>

    <section class="section faq-section" id="faq">
      <div class="shell">
        <p class="eyebrow reveal" id="faq-eyebrow"></p>
        <h2 class="display reveal" id="faq-title"></h2>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>

    <section class="section studio-section" id="studio">
      <div class="shell studio-grid">
        <div class="studio-copy reveal">
          <p class="eyebrow" id="studio-eyebrow"></p>
          <h2 class="display" id="studio-title"></h2>
          <p id="studio-description"></p>
          <div class="studio-facts" id="studio-facts"></div>
          <div class="contact-block">
            <span>Enquiries</span>
            <p id="contact-text"></p>
            <a id="email-link" href=""></a>
            <a id="instagram-link" href="" target="_blank" rel="noopener"></a>
          </div>
          <p class="closing" id="closing"></p>
        </div>
        <figure class="portrait-frame studio-image reveal">
          <img id="studio-image" src="" alt="">
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
